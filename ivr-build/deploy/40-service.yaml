# 클러스터 내부 접속점 — Node-RED 편집기/시나리오 HTTP (1890)
# SIP/RTP 는 hostNetwork 로 노드 IP 에 직접 노출되므로 Service 대상이 아님 (PBX 는 t_ivr_config.local_sip_ip 로 접속)
apiVersion: v1
kind: Service
metadata:
  name: aicc-shr-ivr
  namespace: aicc
  labels:
    app.kubernetes.io/name: aicc-ivr
    app.kubernetes.io/instance: aicc-shr-ivr-a
    aicc/service: ivr
    aicc/group: shr
    aicc/site: a
spec:
  type: ClusterIP
  selector:
    app: aicc-ivr
    aicc/group: shr
    aicc/site: a
  ports:
  - { name: nodered, port: 1890, targetPort: 1890 }
---
# StatefulSet 용 Headless Service — 파드 네트워크 식별자(aicc-shr-ivr-a-0.aicc-shr-ivr-a-hl)
apiVersion: v1
kind: Service
metadata:
  name: aicc-shr-ivr-a-hl
  namespace: aicc
  labels:
    app.kubernetes.io/name: aicc-ivr
    app.kubernetes.io/instance: aicc-shr-ivr-a
    aicc/service: ivr
    aicc/group: shr
    aicc/site: a
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: aicc-ivr
    aicc/group: shr
    aicc/site: a
  ports:
  - { name: nodered, port: 1890, targetPort: 1890 }
