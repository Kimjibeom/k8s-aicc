# U IVR 영속 데이터 PVC — subPath 로 분리 (README §6: 엔진은 무상태, 아래만 영속)
#   ivr/log, ivr/backup : 엔진 로그 + nxwatchdog 일자별 로그 압축본
#   ivr/voice           : 멘트 (이미지 기본 멘트를 첫 기동에 시딩 + Node-RED 업로드 멘트) — ivr·nodered 컨테이너 공유
#   nodered             : Node-RED userDir (flows.json, flows_cred.json, .config.*)
#   ivr/record          : (선택) VMS/녹취 사용 시 — 30-statefulset.yaml 주석 해제
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aicc-ivr-pvc
  namespace: aicc
spec:
  accessModes: [ ReadWriteMany ]
  storageClassName: nfs-client                                  #[환경전환] 스토리지클래스
  resources:
    requests:
      storage: 20Gi
