# 예시 파일. 실제 값을 넣은 사본은 git에 커밋하지 말고 kubectl apply로만 적용할 것.
apiVersion: v1
kind: Secret
metadata:
  name: aicc-secret
  namespace: aicc
type: Opaque
stringData:
  # [환경전환] properties의 ENC(...) 값을 복호화하는 키. 해당 환경 properties를 암호화할 때
  # 쓴 키와 동일해야 함 (불일치 시 앱 기동 중 복호화 예외 발생).
  JASYPT_ENCRYPTOR_PASSWORD: "CHANGE_ME"
