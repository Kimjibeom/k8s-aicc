# IVR Secret 템플릿 — 실제 값 입력 후 20-secret.yaml 로 저장하여 사용 (커밋 금지)
apiVersion: v1
kind: Secret
metadata:
  name: aicc-ivr-secret
  namespace: aicc
type: Opaque
stringData:
  IVR_DB_PASSWORD: "CHANGE_ME"              # [환경전환] uivr DB 계정(nexus) 비밀번호 — db-build 의 NEXUS_DB_PASSWORD 와 동일
  NODERED_CREDENTIAL_SECRET: "CHANGE_ME"    # Node-RED 자격증명(flows_cred.json) 암호키. 한 번 정하면 바꾸지 말 것(바꾸면 복호화 불가)
  # NODERED_ADMIN_PASSWORD_HASH: ""         # 편집기 admin 비밀번호 bcrypt 해시. 비우면 패키지 기본(admin / nexus62402580!)
  #   생성: kubectl -n aicc exec <pod> -c nodered -- node -e "console.log(require('/usr/lib/node_modules/node-red/node_modules/bcryptjs').hashSync(process.argv[1],8))" '<새비밀번호>'
  # CTI_DB_PASSWORD: ""                     # Node-RED CONFIG 탭 JEDAI_CUBE 노드용 (비우면 IVR_DB_PASSWORD)
---
# (선택) 채널(내선) 목록 — SITE_IVR_E164.TXT 형식. SIP 등록 비밀번호가 들어 있어 Secret 으로 관리.
#   미지정 시 IVR_ID=1 에 한해 패키지 샘플(테스트 내선 8개)을 등록 (설치 스크립트와 동일)
#   형식: e164,id,passwd,VOICE|CHAT,ip(미사용),시나리오경로
apiVersion: v1
kind: Secret
metadata:
  name: aicc-ivr-channels
  namespace: aicc
type: Opaque
stringData:
  e164.txt: |
    211001,211001,CHANGE_ME,VOICE,127.0.0.1,/TENANT11_CALL_IVR
    311001,311001,CHANGE_ME,CHAT,127.0.0.1,/CHATBOT
